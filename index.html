<style id="st">
/* Layout: one narrow reading column; a sticky week bar; each day is a date gutter + list of shift rows. */
:root{
  --bg:#f7f6f8; --surface:#ffffff; --fg:#18161c; --muted:#6c6875; --line:#e6e3ea;
  --accent:#b4436c; --accent-soft:#f8e7ee;
  --morn:#b4561f; --morn-soft:#f8eadf; --eve:#4b4fc4; --eve-soft:#e8e9fb; --cust:#1d7a5a; --cust-soft:#e0f1ea; --off:#6b6f7b; --off-soft:#eceef2;
  --add:#1d7a5a; --del:#b42318;
  --d0:#f3eef8; --d1:#eef7f1; --d2:#fbf5e9; --d3:#eef2fb; --d4:#fbefee; --d5:#efeff1; --d6:#efeff1;
  --sans:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111014; --surface:#1a181e; --fg:#ebe8ef; --muted:#958fa0; --line:#2a2730;
  --accent:#ee8fb3; --accent-soft:#3a1f2b;
  --morn:#eb9a66; --morn-soft:#35231a; --eve:#9ea3f5; --eve-soft:#1f2140; --cust:#5cc79e; --cust-soft:#16302a; --off:#a2a8b6; --off-soft:#22262f;
  --add:#5cc79e; --del:#f97066; --d0:#231c2c; --d1:#16261f; --d2:#2a2418; --d3:#182033; --d4:#2c1d1d; --d5:#1d1c21; --d6:#1d1c21; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111014; --surface:#1a181e; --fg:#ebe8ef; --muted:#958fa0; --line:#2a2730;
  --accent:#ee8fb3; --accent-soft:#3a1f2b;
  --morn:#eb9a66; --morn-soft:#35231a; --eve:#9ea3f5; --eve-soft:#1f2140; --cust:#5cc79e; --cust-soft:#16302a; --off:#a2a8b6; --off-soft:#22262f;
  --add:#5cc79e; --del:#f97066; --d0:#231c2c; --d1:#16261f; --d2:#2a2418; --d3:#182033; --d4:#2c1d1d; --d5:#1d1c21; --d6:#1d1c21; color-scheme:dark}
*{box-sizing:border-box}
html,body,button,input,select,textarea,dialog,table{font-family:var(--sans)}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;margin-top:2px}
.pill{font-size:.75rem;padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.btn{font:inherit;font-size:.85rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.status{font-size:.78rem;color:var(--muted);flex-basis:100%}
.panel{margin-top:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;gap:8px}
.panel h2{font-size:.95rem;font-weight:500;margin:0}
.panel p{margin:0;font-size:.85rem;color:var(--muted)}
.panel ul{margin:0;padding-left:18px;font-size:.82rem;display:grid;gap:2px}
.panel .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.panel label{font-size:.85rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel input[type=month]{font:inherit;font-size:.85rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.add{color:var(--add)} .del{color:var(--del)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;margin-top:20px;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-size:.9rem;background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.weekbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px;border-bottom:1px solid var(--line)}
.weekbar .lbl{flex:1;min-width:0;text-align:center;font-size:.9rem}
.weekbar .lbl b{font-weight:500}
.weekbar .dates{display:block;font-size:.75rem;color:var(--muted)}
.arrow{width:36px;height:36px;padding:0;font-size:1.1rem;line-height:1}
#days{display:grid;gap:8px;padding-top:12px;max-width:480px;margin-inline:auto}
.ag{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0}
.ag.s-morning{border-color:color-mix(in srgb,var(--morn) 45%,transparent);background:var(--morn-soft)}
.ag.s-evening{border-color:color-mix(in srgb,var(--eve) 45%,transparent);background:var(--eve-soft)}
.ag.s-custom,.ag.s-unknown{border-color:color-mix(in srgb,var(--cust) 45%,transparent);background:var(--cust-soft)}
.ag[class*=" s-"] .tm{border-left-color:color-mix(in srgb,currentColor 15%,transparent)}
.ag.today{box-shadow:inset 4px 0 0 var(--accent)}
.ag .dt{width:40px;flex:none;text-align:center;line-height:1.1}
.ag .dt b{display:block;font-size:1.5rem;font-weight:700}
.ag .dt span{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ag.today .dt b,.ag.today .dt span{color:var(--accent)}
.ag .tm{flex:1;min-width:0;border-left:1px solid var(--line);padding-left:14px;font-size:1rem;font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.ag.now .tm{color:var(--accent)}
.hrs{flex:none;background:var(--fg);color:var(--bg);border-radius:999px;padding:4px 10px;font-weight:700;font-size:.9rem;white-space:nowrap}
.time{font-size:.8rem;padding-top:1px}
.time small{display:block;color:var(--muted);font-size:.72rem}
.body{min-width:0}
.name{font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:3px;font-size:.8rem;color:var(--muted)}
.chip{font-size:.72rem;padding:1px 7px;border-radius:5px;font-weight:500;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 18%,transparent)}
.k-morning{color:var(--morn);background:var(--morn-soft)}
.k-evening{color:var(--eve);background:var(--eve-soft)}
.k-custom,.k-unknown{color:var(--cust);background:var(--cust-soft)}
.k-off{color:var(--off);background:var(--off-soft)}
.raw{font-size:.72rem;color:var(--muted);border:1px solid color-mix(in srgb,var(--muted) 35%,transparent);border-radius:5px;padding:0 5px}
.off{color:var(--muted);font-size:.85rem;font-style:italic}
.note{font-size:.75rem;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:.78rem;color:var(--muted);align-items:center}
/* Month tab */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding-top:10px}
.cal .h{font-size:.72rem;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{min-height:64px;border-radius:8px;padding:5px 6px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cell.blank{visibility:hidden}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cell .n{font-size:.78rem;font-weight:500}
.cell .s{font-size:.68rem;font-weight:500;border-radius:4px;padding:1px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.k-off,.cell.k-none{background:var(--surface)}
.cell.k-none .n{color:var(--muted)}
.cell.k-morning{border-color:color-mix(in srgb,var(--morn) 30%,transparent)}
.cell.k-evening{border-color:color-mix(in srgb,var(--eve) 30%,transparent)}
.cell.k-custom,.cell.k-unknown{border-color:color-mix(in srgb,var(--cust) 30%,transparent)}
.cell.k-morning,.cell.k-evening,.cell.k-custom,.cell.k-unknown{color:inherit}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:1.25rem;font-weight:500}
.stat span{font-size:.75rem;color:var(--muted)}
@media (max-width:480px){.cell{min-height:54px;padding:4px}.cell .s{font-size:.62rem;padding:1px 2px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:last-child:nth-child(odd){grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.cls{transition:opacity .2s}}
</style>

<div class="wrap" id="app">
  <header class="top">

      <h1>Kotya's job schedule 🍰</h1>

<script type="application/json" id="schedule-data">{"meta":{"updated":"2026-10-03T11:20:00.000Z"},"person":"Maria","source":{"file":"GRAFIK.xlsx","imported":"2026-10-03T11:20:00.000Z","days":{"1":"rano","2":"rano","3":"-","4":"-","5":"-","6":"wieczór","7":"do 13:00","8":"do 11","9":"-","10":"-","11":"-","12":"-","13":"-","14":"do 13:00","15":"do 13:00","16":"rano","17":"-","18":"-","19":"od 7-9/12-16:30","20":"od 17","21":"-","22":"-","23":"rano","24":"-","25":"-","26":"-","27":"od 17","28":"do 13:00","29":"do 13:00","30":"rano","31":"-"}}}</script>
<script>
const MAIN_SRC=document.currentScript?document.currentScript.textContent:"";
const SHELL=document.getElementById("app").outerHTML;
const STYLE=document.getElementById("st").textContent;
const LS_KEY="kotya-job-v1";
const SKEL='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
const IS_ARTIFACT=!!(window.claude&&typeof window.claude.use==="function");

/* ===== shift core (pure functions, no DOM) ===== */
/* Shift definitions. "rano" = morning, "wieczór" = evening. "do X" = until X (starts at the morning start),
   "od X" = from X (ends at the evening end), "7-9/12-16:30" = split shift. */
const SHIFTS={morning:{a:"07:00",b:"15:00",name:"Morning shift"},evening:{a:"14:00",b:"22:00",name:"Evening shift"}};
const DAY_START=SHIFTS.morning.a, DAY_END=SHIFTS.evening.b;
const toMinutes=t=>{const[h,m]=t.split(":").map(Number);return h*60+(m||0)};
const hhmm=n=>`${String(Math.floor(n/60)).padStart(2,"0")}:${String(n%60).padStart(2,"0")}`;
const fold=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ł/g,"l").trim();
const tm=s=>{const m=/^(\d{1,2})(?:[:.](\d{2}))?$/.exec(s.trim());if(!m||+m[1]>24||+(m[2]||0)>59)return null;return hhmm(+m[1]*60+ +(m[2]||0))};

function parseEntry(raw){
  const r=String(raw??"").trim(), f=fold(r);
  if(!f||/^[-–—_.x]+$/.test(f)||/^(wolne|off|urlop|l4)$/.test(f))return {kind:"off",segs:[],raw:r,name:f&&/urlop/.test(f)?"Leave":"Day off"};
  if(/^rano\b/.test(f))return {kind:"morning",segs:[[SHIFTS.morning.a,SHIFTS.morning.b]],raw:r,name:SHIFTS.morning.name};
  if(/^wie?r?cz?or\b/.test(f))return {kind:"evening",segs:[[SHIFTS.evening.a,SHIFTS.evening.b]],raw:r,name:SHIFTS.evening.name};
  let mode="";let s=f;
  const pm=/^(od|do)\b\s*(.*)$/.exec(s);if(pm){mode=pm[1];s=pm[2]}
  const segs=[];
  for(const part of s.split(/\s*[\/,;]\s*|\s+i\s+/).filter(Boolean)){
    const rg=/^(\d{1,2}(?:[:.]\d{2})?)\s*[-–]\s*(\d{1,2}(?:[:.]\d{2})?)$/.exec(part);
    if(rg){const a=tm(rg[1]),b=tm(rg[2]);if(a&&b){segs.push([a,b]);continue}}
    const one=tm(part.replace(/^(od|do)\s*/,""));
    if(one){const m=/^do/.test(part)?"do":/^od/.test(part)?"od":mode;
      if(m==="do"){segs.push([DAY_START,one]);continue}
      if(m==="od"){segs.push([one,DAY_END]);continue}}
    return {kind:"unknown",segs:[],raw:r,name:"See note"};
  }
  if(!segs.length)return {kind:"unknown",segs:[],raw:r,name:"See note"};
  const name=segs.length>1?"Split shift":mode==="do"?`Until ${segs[0][1]}`:mode==="od"?`From ${segs[0][0]}`:"Custom hours";
  return {kind:"custom",segs,raw:r,name};
}
const minutesOf=p=>p.segs.reduce((t,[a,b])=>t+Math.max(0,toMinutes(b)-toMinutes(a)),0);
const fmtH=min=>{const h=min/60;return (Number.isInteger(h)?h:h.toFixed(1).replace(/\.0$/,""))+" h"};
const shortOf=p=>p.kind==="off"?"off":p.kind==="unknown"?p.raw:p.segs.map(([a,b])=>`${a.replace(/^0/,"").replace(/:00$/,"")}–${b.replace(/^0/,"").replace(/:00$/,"")}`).join(", ");

/* Read the shift workbook: sheet = {get(r,c), maxR, maxC} (0-based). Finds the person's column and the day-number column. */
function parseSheet(sheet,person){
  const txt=(r,c)=>{const v=sheet.get(r,c);return v==null?"":String(v).trim()};
  let hr=-1,pc=-1;
  for(let r=0;r<=Math.min(sheet.maxR,15)&&hr<0;r++)for(let c=0;c<=sheet.maxC;c++)if(fold(txt(r,c))===fold(person)){hr=r;pc=c;break}
  if(hr<0)throw new Error(`Couldn't find the “${person}” column in this file.`);
  let dc=-1,best=0;
  for(let c=0;c<=sheet.maxC;c++){if(c===pc)continue;let n=0;for(let r=hr+1;r<=sheet.maxR;r++){const v=txt(r,c);if(/^\d{1,2}$/.test(v)&&+v>=1&&+v<=31)n++}if(n>best){best=n;dc=c}}
  if(dc<0||best<7)throw new Error("Couldn't find the column with day numbers (1, 2, 3…).");
  const days={};
  for(let r=hr+1;r<=sheet.maxR;r++){
    const v=txt(r,dc);if(!/^\d{1,2}$/.test(v))continue;const d=+v;if(d<1||d>31)continue;
    days[d]=txt(r,pc);
  }
  if(!Object.keys(days).length)throw new Error(`No days were found for ${person} in this file.`);
  return {days};
}
/* ===== end core ===== */

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];

/* One schedule at a time: {file, imported, days:{"1":"rano",…}}. Its days are shown in the current calendar month. */
const normalize=x=>{if(x&&!x.source&&x.months){const k=Object.keys(x.months).sort().pop();x={meta:x.meta,person:x.person,source:x.months[k]}}return x};
let DATA=normalize(JSON.parse($("schedule-data").textContent)), fromDevice=false;
try{const l=normalize(JSON.parse(store.get(LS_KEY)||"null"));if(l&&l.meta&&l.source&&l.meta.updated>DATA.meta.updated){DATA=l;fromDevice=true}}catch(e){}

/* ---------- derived state ---------- */
const local=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const mkey=d=>iso(d).slice(0,7);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dm=d=>`${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}`;
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))};
const mlabel=k=>{const[y,m]=k.split("-").map(Number);return `${MONTHS[m-1]} ${y}`};
let ANCHOR,NWEEKS,OCC,CM;
const curMonth=()=>mkey(new Date());
function entryOf(d){if(mkey(d)!==CM)return null;const v=DATA.source.days[String(d.getDate())];return v==null?null:parseEntry(v)}
function derive(){
  CM=curMonth();
  const first=local(CM+"-01"), last=new Date(first.getFullYear(),first.getMonth()+1,0), dim=last.getDate();
  ANCHOR=mondayOf(first);NWEEKS=Math.floor((mondayOf(last)-ANCHOR)/(7*864e5))+1;
  OCC=[];
  for(const[dd,v]of Object.entries(DATA.source.days)){
    if(+dd<1||+dd>dim)continue;
    const d=new Date(first.getFullYear(),first.getMonth(),+dd), p=parseEntry(v);
    p.segs.forEach(([a,b])=>OCC.push({d,a,b,p,start:new Date(d.getFullYear(),d.getMonth(),d.getDate(),...a.split(":").map(Number)),end:new Date(d.getFullYear(),d.getMonth(),d.getDate(),...b.split(":").map(Number))}));
  }
  OCC.sort((x,y)=>x.start-y.start);
}
const weekIdx=d=>Math.floor((mondayOf(d)-ANCHOR)/(7*864e5));

/* ---------- rendering ---------- */
let wk;
function agenda(d,p,now,isToday){
  const at=t=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),...t.split(":").map(Number));
  const st=p.segs.length?(p.segs.some(([a,b])=>at(a)<=now&&at(b)>now)?" now":""):"";
  const tm=p.segs.length?p.segs.map(([a,b])=>`${a} – ${b}`).join("<br>"):esc(p.raw);
  return `<div class="ag s-${p.kind}${isToday?" today":""}${st}"><div class="dt"><b>${d.getDate()}</b><span>${DAYS[(d.getDay()+6)%7]}</span></div><div class="tm">${tm}</div><div class="hrs">${p.segs.length?fmtH(minutesOf(p)):"?"}</div></div>`;
}
function renderWeek(){
  const now=new Date(), today=iso(now), mon=addDays(ANCHOR,wk*7), sun=addDays(mon,6);
  $("wlbl").innerHTML=`<b>Week ${wk+1}</b>`;
  $("prev").disabled=wk<=0;$("nextw").disabled=wk>=NWEEKS-1;
  let h="",mins=0,shifts=0;
  for(let i=0;i<7;i++){
    const d=addDays(mon,i), s=iso(d), p=entryOf(d);
    if(!p||p.kind==="off")continue;
    h+=agenda(d,p,now,s===today);
    if(p.segs.length){mins+=minutesOf(p);shifts++}
  }
  $("days").innerHTML=h||'<div class="off">No work this week</div>';
}
function defaultWeek(){const now=new Date();const nx=OCC.find(o=>o.end>now);const i=weekIdx(now);return Math.max(0,Math.min(NWEEKS-1,i>=0&&i<NWEEKS?i:weekIdx(nx?nx.start:now)))}
function renderMonth(){
  const [y,m]=CM.split("-").map(Number), dim=new Date(y,m,0).getDate(), lead=(new Date(y,m-1,1).getDay()+6)%7, now=new Date(), today=iso(now);
  let h=DAYS.map(d=>`<div class="h">${d}</div>`).join("")+'<div class="cell blank"></div>'.repeat(lead);
  let mins=0,work=0,morn=0,eve=0,off=0;
  for(let d=1;d<=dim;d++){
    const dt=new Date(y,m-1,d), s=iso(dt), p=entryOf(dt), k=p?p.kind:"none";
    if(p){if(p.segs.length){work++;mins+=minutesOf(p)}if(k==="morning")morn++;if(k==="evening")eve++;if(k==="off")off++}
    const tag=!p?"":k==="off"?"":`<span class="s k-${k}">${esc(shortOf(p))}</span>`;
    h+=`<button class="cell k-${k}${s===today?" today":""}" data-d="${s}" title="${p?esc(`${p.name}${p.raw?" — "+p.raw:""}`):"No data"}"><span class="n">${d}</span>${tag}</button>`;
  }
  $("cal").innerHTML=h;
  $("stats").innerHTML=[[work,"working days"],[fmtH(mins),"total hours"],[fmtH(Math.round(mins/(dim/7))),"avg per week"],[`${morn} / ${eve}`,"mornings / evenings"],[off,"days off"]].map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
}
$("cal").addEventListener("click",e=>{const c=e.target.closest(".cell[data-d]");if(!c)return;wk=Math.max(0,Math.min(NWEEKS-1,weekIdx(local(c.dataset.d))));setTab("week");renderWeek()});
function fmtStamp(isoStr){try{const d=new Date(isoStr);return `${dm(d)}.${d.getFullYear()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}catch(e){return isoStr}}
function renderStatus(){}
function renderAll(){derive();renderWeek();renderMonth();renderStatus()}

/* ---------- update flow ---------- */
const panel=$("panel");
function showPanel(html){panel.innerHTML=html;panel.hidden=false}
function closePanel(){panel.hidden=true;panel.innerHTML="";pending=null}
panel.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;
  if(b.dataset.act==="close")closePanel();
  if(b.dataset.act==="apply")applyPending(b);});
let pending=null;
function dayLine(d,v){const p=parseEntry(v);return `Day ${esc(d)} · ${esc(p.kind==="off"?"off":p.raw||"empty")}${p.segs.length?` (${esc(shortOf(p))})`:""}`}
function reviewUpdate(){
  const {file,days}=pending, old=DATA.source.days, changes=[];
  const all=[...new Set([...Object.keys(old),...Object.keys(days)])].sort((a,b)=>a-b);
  for(const d of all){const a=old[d]??"",b=days[d]??"";if(fold(a)!==fold(b))changes.push(`${dayLine(d,b)} <span class="note">was ${esc(a||"empty")}</span>`)}
  const work=Object.values(days).map(parseEntry).filter(p=>p.segs.length), mins=work.reduce((t,p)=>t+minutesOf(p),0);
  const unk=Object.entries(days).filter(([,v])=>parseEntry(v).kind==="unknown");
  showPanel(`<h2>${esc(file)}: ${esc(DATA.person)}, ${Object.keys(days).length} days</h2>
    <p>${work.length} working days · ${fmtH(mins)} · ${changes.length?`${changes.length} change${changes.length===1?"":"s"} from the current schedule`:"same as the current schedule"}. This replaces the current schedule.</p>
    ${changes.length?`<div class="k">Changed days (${changes.length})</div><ul>${changes.slice(0,31).map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
    ${unk.length?`<div class="k del">Hours unclear (${unk.length})</div><ul>${unk.map(([d,v])=>`<li>Day ${esc(d)}: ${esc(v)}</li>`).join("")}</ul>`:""}
    <div class="row"><button class="btn primary" data-act="apply">Replace schedule</button><button class="btn" data-act="close">Cancel</button></div>`);
}
async function applyPending(btn){
  if(!pending)return;btn.disabled=true;
  const {file,days}=pending;pending=null;
  const now=new Date().toISOString();
  const next={meta:{...DATA.meta,updated:now},person:DATA.person,source:{file,imported:now,days}};
  if(IS_ARTIFACT){
    const art=await window.claude.use("artifact").catch(()=>null);
    if(art){
      try{btn.textContent="Saving…";await art.publish(buildDoc(next));return}
      catch(e){
        if(e&&e.code==="conflict")return;
        if(e&&(e.code==="rate_limited"||e.code==="upstream_error")){showPanel(`<h2>Couldn't save right now</h2><p>${e.code==="rate_limited"?"Too many saves in a short time. Wait a minute and try again.":"The save didn't go through. Try again in a moment."}</p><div class="row"><button class="btn" data-act="close">Close</button></div>`);return}
      }
    }
  }
  const ok=store.set(LS_KEY,JSON.stringify(next));
  DATA=next;fromDevice=ok;renderAll();wk=defaultWeek();renderWeek();
  showPanel(`<h2>Updated</h2><p>${ok?"Saved on this device. Other devices keep their own copy.":"Updated for now. This browser doesn't allow saving, so the update will be gone after a reload."}</p><div class="row"><button class="btn" data-act="close">Close</button></div>`);
}
function buildDoc(data){
  const json=JSON.stringify(data).replace(/</g,"\\u003c");
  return SKEL+'\n<title>Kotya Job Schedule</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">\n<style id="st">'+STYLE+"</style>\n\n"+SHELL+'\n\n<script type="application/json" id="schedule-data">'+json+"<\/script>\n<script>"+MAIN_SRC+"<\/script>\n\n</body></html>";
}

/* Excel */
let xlsxLib=null;
function loadXlsxLib(){if(window.XLSX)return Promise.resolve(window.XLSX);if(xlsxLib)return xlsxLib;
  xlsxLib=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=()=>{xlsxLib=null;rej(new Error("Couldn't load the Excel reader. Check your internet connection and try again."))};document.head.appendChild(s)});return xlsxLib}
$("loadXlsx").onclick=()=>{$("xlsxFile").value="";$("xlsxFile").click()};
$("xlsxFile").addEventListener("change",async ev=>{
  const f=ev.target.files&&ev.target.files[0];if(!f)return;
  showPanel(`<h2>Reading ${esc(f.name)}…</h2>`);
  try{
    const [XLSX,buf]=await Promise.all([loadXlsxLib(),f.arrayBuffer()]);
    const wb=XLSX.read(buf,{type:"array"});
    let parsed=null,lastErr=null;
    for(const name of wb.SheetNames){const ws=wb.Sheets[name];if(!ws||!ws["!ref"])continue;const rg=XLSX.utils.decode_range(ws["!ref"]);
      const sheet={get:(r,c)=>{const cell=ws[XLSX.utils.encode_cell({r,c})];return cell?(cell.w!=null&&typeof cell.v!=="number"?cell.w:cell.v):undefined},maxR:rg.e.r,maxC:rg.e.c};
      try{parsed=parseSheet(sheet,DATA.person);break}catch(e){lastErr=e}}
    if(!parsed)throw lastErr||new Error("This file has no schedule sheet.");
    const name=f.name.replace(/^[0-9a-f]{8}-\d+_/i,"");
    pending={file:name,days:parsed.days};
    reviewUpdate();
  }catch(e){pending=null;showPanel(`<h2>Couldn't read this file</h2><p>${esc(e.message||e)}</p><p>Use the shift schedule (grafik) with a “${esc(DATA.person)}” column and day numbers down the first column.</p><div class="row"><button class="btn" data-act="close">Close</button></div>`)}
});

/* ---------- tabs, navigation ---------- */
function setTab(t){const w=t==="week";$("t-week").setAttribute("aria-selected",w);$("t-month").setAttribute("aria-selected",!w);$("v-week").hidden=!w;$("v-month").hidden=w;store.set("kotya-tab",t)}
$("t-week").onclick=()=>setTab("week");$("t-month").onclick=()=>setTab("month");
$("prev").onclick=()=>{wk--;renderWeek()};$("nextw").onclick=()=>{wk++;renderWeek()};
$("today").onclick=()=>{wk=defaultWeek();renderWeek()};

renderAll();wk=defaultWeek();renderWeek();
if(store.get("kotya-tab")==="month")setTab("month");
setInterval(()=>{renderWeek()},60000);

/* PWA: offline cache (when hosted as its own site over HTTPS) */
if("serviceWorker" in navigator&&window.top===window&&document.querySelector('link[rel="manifest"]')){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
